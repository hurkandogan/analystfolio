[project]
name = "analystfolio"
version = "0.1.0"
description = ""
authors = [
    {name = "Hurkan Dogan",email = "60603139+hurkandogan@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "ib-async (>=2.1.0,<3.0.0)",
    "ttkbootstrap (>=1.19.2,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "html5lib (>=1.1,<2.0)",
    "alembic (>=1.17.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.taskipy.tasks]
start = "python main.py"
seed = "python seed_data.py"
scrape = "python market_loader.py"

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
